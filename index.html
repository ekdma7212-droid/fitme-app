<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FIT ME</title>
  <style>
    body {
      margin: 0;
      background: #faf8ff;
      font-family: Arial, sans-serif;
      color: #292433;
    }
    header {
      padding: 30px 20px;
      background: white;
      text-align: center;
    }
    h1 {
      color: #9575cd;
      font-size: 32px;
      margin: 0;
    }
    main {
      padding: 24px;
    }
    .card {
      background: white;
      padding: 24px;
      border-radius: 20px;
      margin-bottom: 16px;
      box-shadow: 0 4px 16px #ddd5ed55;
    }
    button {
      background: #a78bfa;
      color: white;
      border: none;
      border-radius: 12px;
      padding: 14px 20px;
      font-size: 16px;
      width: 100%;
    }
  </style>
</head>
<body>
  <header>
    <h1>FIT ME</h1>
    <p>나에게 어울리는 스타일을 만나다</p>
  </header>

  <main>
    <div class="card">
      <h2>AI 가상 피팅</h2>
      <p>구매하기 전에 나에게 어울리는지 확인하세요.</p>
      <button>AI로 입어보기</button>
    </div>

    <div class="card">
      <h2>AI 퍼스널 컬러</h2>
      <p>나에게 어울리는 컬러와 스타일을 찾아보세요.</p>
      <button>스타일 분석하기</button>
    </div>

    <div class="card">
      <h2>쇼핑</h2>
      <p>다양한 쇼핑몰의 인기 상품을 만나보세요.</p>
      <button>쇼핑 시작하기</button>
    </div>
  </main>
</body>
</html>
